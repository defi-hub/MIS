[package]
name = "mis-orchestrator"
version = "2.1.1"
edition = "2021"
authors = ["Sergey Defis <xoomi16@gmail.com>"]
description = "MIS Orchestrator v2.1.1 - Production token-based security orchestration"
license = "MIT"
rust-version = "1.75"

[[bin]]
name = "mis-orchestrator"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "rt-multi-thread", "signal"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# eBPF
libbpf-rs = "0.22"
libbpf-sys = "1.3"

# Cryptography
ed25519-dalek = "2.1"
sha2 = "0.10"
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
bincode = "1.3"

# gRPC
tonic = "0.11"
prost = "0.12"
prost-types = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# System utilities
nix = { version = "0.27", features = ["signal", "process"] }
num_cpus = "1.16"

[build-dependencies]
tonic-build = "0.11"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
